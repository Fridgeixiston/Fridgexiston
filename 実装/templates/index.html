<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Fridgexiston</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>Fridgexiston</h1>

<hr>

<h2>メニュー</h2>

<ul>

    <li>
        <a href="/auth/login">
            ログイン
        </a>
    </li>

    <li>
        <a href="/auth/register">
            新規登録
        </a>
    </li>

</ul>

<hr>

<h2>買い物リスト追加</h2>

<form action="/shopping/add" method="POST">

    <input
        type="text"
        name="name"
        placeholder="食材名"
        required>

    <input
        type="number"
        name="quantity"
        value="1"
        min="1">

    <button type="submit">
        追加
    </button>

</form>

<hr>

<h2>在庫追加</h2>

<form action="/stock/add" method="POST">

    <input
        type="text"
        name="name"
        placeholder="食材名"
        required>

    <input
        type="number"
        name="quantity"
        value="1"
        min="1">

    <button type="submit">
        追加
    </button>

</form>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
